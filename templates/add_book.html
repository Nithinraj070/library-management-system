{% extends "base.html" %}

{% block title %}
Add Book
{% endblock %}

{% block content %}

<div class="page-header">

    <h1>
        Add Book
    </h1>

</div>


<form
    method="POST"
    class="book-form"
>

    <label>
        Book ID
    </label>

    <input
        type="number"
        name="book_id"
        required
    >


    <label>
        Title
    </label>

    <input
        type="text"
        name="title"
        required
    >


    <label>
        Author
    </label>

    <input
        type="text"
        name="author"
        required
    >


    <label>
        Category
    </label>

    <input
        type="text"
        name="category"
    >


    <label>
        Publisher
    </label>

    <input
        type="text"
        name="publisher"
    >


    <label>
        ISBN
    </label>

    <input
        type="text"
        name="isbn"
    >


    <label>
        Quantity
    </label>

    <input
        type="number"
        name="quantity"
        min="1"
        required
    >


    <button type="submit">
        Add Book
    </button>

</form>

{% endblock %}
