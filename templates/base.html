<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Library Management System
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Library Management System
    </div>

    <div class="nav-links">

        <a href="{{ url_for('home') }}">
            Dashboard
        </a>

        <a href="{{ url_for('books') }}">
            Books
        </a>

        <a href="{{ url_for('members') }}">
            Members
        </a>

        <a href="{{ url_for('borrow') }}">
            Borrow & Return
        </a>

        <a href="{{ url_for('reservations') }}">
            Reservations
        </a>

        <a href="{{ url_for('fines') }}">
            Fines
        </a>

    </div>

</nav>

<main class="container">

    {% block content %}
    {% endblock %}

</main>

</body>

</html>
